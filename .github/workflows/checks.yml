name: Kontroller
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Yayın dosyalarını kontrol et
        run: npm run check:publication
      - name: Çalıştırıcı ve puanlama testleri
        run: npm test
      - name: Kayıt ve istek gövdesi doğrulaması
        run: npm run verify
      - name: Kayıtlı yanıtlarla sonuçları tekrar üret
        run: npm run replay
